name: CI/CD Pipeline — Principiante

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/devops-app

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Build & Test
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build and Test (Java/Quarkus)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run tests
        run: mvn clean verify --batch-mode --no-transfer-progress
        working-directory: app/

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/target/surefire-reports/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Build & Push Docker image (main only)
  # ─────────────────────────────────────────────────────────────────────────────
  build-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Deploy to Azure (main only)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-azure:
    name: Deploy to Azure Container Instances
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/main'

    environment:
      name: production
      url: ${{ steps.deploy.outputs.app-url }}

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          # Secret format (JSON stored in GitHub Secrets as AZURE_CREDENTIALS):
          # {
          #   "clientId": "<service-principal-client-id>",
          #   "clientSecret": "<service-principal-secret>",
          #   "subscriptionId": "<azure-subscription-id>",
          #   "tenantId": "<azure-tenant-id>"
          # }

      - name: Deploy to Azure Container Instances
        id: deploy
        uses: azure/aci-deploy@v1
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          dns-name-label: devops-app-${{ github.run_number }}
          image: ${{ needs.build-image.outputs.image-tag }}
          registry-login-server: ${{ env.REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          name: devops-app
          location: eastus
          ports: 8080
          environment-variables: APP_ENV=production

      - name: Show deployed URL
        run: |
          echo "✅ Application deployed!"
          echo "URL: http://devops-app-${{ github.run_number }}.eastus.azurecontainer.io:8080/health"
