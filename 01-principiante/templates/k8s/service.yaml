apiVersion: v1
kind: Service
metadata:
  name: devops-app
  namespace: default
  labels:
    app: devops-app
spec:
  selector:
    app: devops-app
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080        # Access via: minikube service devops-app --url
  type: NodePort
