name: Security Scan Pipeline

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # Weekly on Monday at 03:00 UTC

permissions:
  contents: read
  security-events: write   # Required to upload SARIF to GitHub Security tab
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/devops-app

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # SAST — Static Analysis (Semgrep)
  # ─────────────────────────────────────────────────────────────────────────────
  sast:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/java
            p/owasp-top-ten
            p/secrets
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # SCA — Software Composition Analysis (OWASP Dependency-Check)
  # ─────────────────────────────────────────────────────────────────────────────
  sca:
    name: SCA — Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: devops-app
          path: app/
          format: HTML,SARIF
          failBuildOnCVSS: 7        # Fail on CVSS >= 7.0

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/dependency-check-report.sarif

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/dependency-check-report.html

  # ─────────────────────────────────────────────────────────────────────────────
  # Container Scan — Trivy (CRITICAL + HIGH CVEs + SBOM)
  # ─────────────────────────────────────────────────────────────────────────────
  container-scan:
    name: Container Scan — Trivy
    runs-on: ubuntu-latest
    needs: []     # Can run in parallel with sast and sca

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image to scan
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Run Trivy — SARIF (Security tab upload)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"            # Fail on CRITICAL or HIGH

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM (CycloneDX JSON)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx
          output: sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Image Signing — Cosign keyless (Sigstore/OIDC)
  # ─────────────────────────────────────────────────────────────────────────────
  sign-image:
    name: Sign Image — Cosign (keyless)
    runs-on: ubuntu-latest
    needs: container-scan
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write
      id-token: write    # Required for OIDC-based keyless signing

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign container image (keyless via Sigstore OIDC)
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        # No private key needed — GitHub OIDC token used for keyless signing
        # Verify with: cosign verify --certificate-identity-regexp=".*" \
        #              --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
        #              ghcr.io/<image>:<tag>
